<g><use href="#rose" x="120" y="250"/><use href="#rose" x="132" y="300" transform="scale(.8)" transform-origin="132 300"/><use href="#rose" x="118" y="420"/><use href="#rose" x="380" y="250"/><use href="#rose" x="384" y="380"/><use href="#rose" x="176" y="520"/><use href="#rose" x="320" y="520"/><use href="#rose" x="190" y="210"/><use href="#rose" x="310" y="212"/></g>
</g>
<path d="M222 590H278L470 900H30Z" fill="url(#aisle)"/>
<g><use href="#chair" x="80" y="680"/><use href="#chair" x="40" y="760" transform="scale(1.2)" transform-origin="40 760"/><use href="#chair" x="420" y="680"/><use href="#chair" x="460" y="760" transform="scale(1.2)" transform-origin="460 760"/><use href="#rose" x="60" y="650"/><use href="#rose" x="440" y="650"/></g>
