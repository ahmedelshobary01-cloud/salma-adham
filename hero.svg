<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 900" preserveAspectRatio="xMidYMax slice">
<defs><style>.walk{animation:walk 14s ease-in-out infinite}
@keyframes walk{0%{transform:translate(250px,880px) scale(1);opacity:0}6%{opacity:1}88%{opacity:1}100%{transform:translate(250px,600px) scale(.38);opacity:0}}
.lg{transform-box:fill-box;transform-origin:50% 0;animation:step .7s ease-in-out infinite alternate}
.lg2{animation-direction:alternate-reverse}
@keyframes step{from{transform:rotate(7deg)}to{transform:rotate(-7deg)}}
.gown{transform-box:fill-box;transform-origin:50% 0;animation:sway .7s ease-in-out infinite alternate}
@keyframes sway{from{transform:skewX(-2.5deg)}to{transform:skewX(2.5deg)}}
.veil{transform-box:fill-box;transform-origin:50% 0;animation:sway 1.4s ease-in-out infinite alternate}
.chand{transform-box:fill-box;transform-origin:50% 0;animation:sway 3s ease-in-out infinite alternate}</style>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b98a8a"/><stop offset=".35" stop-color="#eab08a"/><stop offset=".5" stop-color="#f7d3a6"/></linearGradient>
<linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9a98f"/><stop offset="1" stop-color="#a98176"/></linearGradient>
<linearGradient id="col" x1="0" x2="1"><stop offset="0" stop-color="#d9c6b0"/><stop offset=".45" stop-color="#fbf0e2"/><stop offset="1" stop-color="#c9b29a"/></linearGradient>
<linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d7b49a"/><stop offset="1" stop-color="#b99178"/></linearGradient>
<linearGradient id="aisle" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3e6dc"/><stop offset="1" stop-color="#e6d6cc"/></linearGradient>
<radialGradient id="sun" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff4d6"/><stop offset="1" stop-color="#fff4d6" stop-opacity="0"/></radialGradient>
<g id="rose"><circle r="7" fill="#e7a6a4"/><circle cx="-8" cy="4" r="6" fill="#f3c3bd"/><circle cx="8" cy="3" r="6" fill="#d98f8f"/><circle cx="0" cy="9" r="5" fill="#f7d6cf"/><circle cx="-4" cy="-6" r="4" fill="#c97b7d"/><path d="M-14 6q-6 4-8 10M14 6q6 4 8 10" stroke="#6f7f55" stroke-width="2"/></g>
<g id="chair"><rect x="-14" y="-18" width="28" height="8" rx="3" fill="#efe6dc"/><path d="M-12-10v26M12-10v26M-12-18v-26h24v26" stroke="#b98a55" stroke-width="3" fill="none"/></g>
</defs>
<rect width="500" height="900" fill="url(#sky)"/>
<circle cx="300" cy="440" r="160" fill="url(#sun)"/>
<path d="M0 400q60-40 120-20t60 30H0z" fill="#9c7a78" opacity=".8"/>
<rect y="425" width="500" height="80" fill="url(#sea)"/>
<path d="M0 505H500V900H0Z" fill="url(#floor)"/>
<g>
<ellipse cx="250" cy="600" rx="200" ry="38" fill="#cdb4a0"/>
<ellipse cx="250" cy="580" rx="180" ry="34" fill="#e7d8c8"/>
<ellipse cx="250" cy="560" rx="160" ry="30" fill="#f1e5d7"/>
